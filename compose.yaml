services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ject_checkin
      MYSQL_USER: ject_app
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:-local-app-password}
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:-local-root-password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - --host=127.0.0.1
        - --user=root
        - --password=${LOCAL_MYSQL_ROOT_PASSWORD:-local-root-password}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
