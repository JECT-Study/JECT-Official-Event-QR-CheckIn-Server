services:
  mysql:
    image: mysql:8.4
    container_name: ject-checkin-mysql
    restart: unless-stopped
    env_file:
      - /opt/ject-checkin/.env
    command:
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=8M
      - --max-connections=50
      - --performance-schema=OFF
      - --table-open-cache=400
      - --thread-cache-size=8
      - --skip-name-resolve
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 320m
    cpus: 0.75
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user="$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    image: ject-checkin-server:latest
    container_name: ject-checkin-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - /opt/ject-checkin/.env
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseSerialGC
        -XX:InitialRAMPercentage=20
        -XX:MaxRAMPercentage=60
        -Xss256k
        -XX:+ExitOnOutOfMemoryError
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 256m
    cpus: 0.75
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8080/actuator/health
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mysql-data:
